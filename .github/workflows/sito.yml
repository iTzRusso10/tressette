# Builds the website from the app (Expo web export) and publishes it on GitHub Pages.
# In the repo settings, Pages → Source must be "GitHub Actions".
name: Sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Controlli (tipi, lint, regole)
        run: npm run check
      - name: Sito dall'app
        # Tree shaking di Metro (docs.expo.dev/guides/tree-shaking): toglie gli export mai usati, ≈ 96 KB gzip di JS.
        # Solo per il sito: le build native restano come sono.
        env:
          EXPO_UNSTABLE_TREE_SHAKING: 1
          EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH: 1
        run: |
          npx expo export -p web
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
